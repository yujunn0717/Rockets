<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Rockets Lineup Manager">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="stylesheet" href="styles-v10216.css">
<title>Rockets Lineup Manager v1.0.2.13</title></head><body>
<div id="rotateGate" class="rotate-gate"><div class="rotate-card"><div class="rotate-icon">↻</div><h2>기기를 세로로 돌려주세요</h2><p>Rockets Lineup Manager는 세로 화면에 맞춰져 있어요.</p></div></div>
<div id="languageGate" class="gate hidden"><div class="gate-card"><h1>언어 선택</h1><p>Select language · 言語を選択</p><button data-lang="ko">한국어</button><button data-lang="en">English</button><button data-lang="ja">日本語</button></div></div>
<header class="topbar"><button id="undoBtn" class="icon">↶</button><button id="redoBtn" class="icon">↷</button><input id="gameTitle" aria-label="경기 제목"><div class="top-actions"><button id="saveGameBtn" data-i="saveLineup">라인업 저장</button><button id="shareBtn" data-i="saveImage">저장</button></div></header>
<main>
<section id="positionTab" class="tab active"><div class="position-layout"><div id="boardCard" class="card board-card"><div id="field" class="field"><img src="baseball-field.png" alt="baseball field"><div id="markers"></div><div id="benchPanel" class="bench-panel"></div></div></div><div id="portraitTable" class="portrait-table card watermark-card"></div></div><div id="warnings" class="warnings"></div></section>
<section id="lineupTab" class="tab"><div class="lineup-grid"><div class="card watermark-card"><h2 data-i="starters">선발</h2><div id="starterEditor"></div><button id="addStarter" class="primary">+ 타순 추가</button></div><div class="card watermark-card"><h2 data-i="bench">벤치</h2><div id="benchEditor"></div><button id="addBench" class="primary">+ 벤치 추가</button></div></div></section>
<section id="settingsTab" class="tab"><div class="settings-grid"><div class="card settings-options"><h2 data-i="teamSettings">팀 설정</h2><fieldset><legend data-i="dh">지명타자</legend><div class="radio-row"><label><input type="radio" name="dh" value="on"> <span data-i="use">사용</span></label><label><input type="radio" name="dh" value="off"> <span data-i="notUse">미사용</span></label></div></fieldset><fieldset><legend data-i="benchPosition">포지션 탭 벤치멤버</legend><div class="radio-row"><label><input type="radio" name="showBench" value="on"> <span data-i="show">보이기</span></label><label><input type="radio" name="showBench" value="off"> <span data-i="hide">숨기기</span></label></div></fieldset></div><div class="card"><h2 data-i="playerManagement">선수 관리</h2><div class="player-head"><span data-i="number">등번호</span><span data-i="name">이름</span><span data-i="position">포지션</span><span></span></div><div id="playerManager"></div><button id="addPlayer" class="primary">+ 선수 추가</button></div><div class="card"><h2>데이터</h2><div class="button-row data-actions"><button id="exportJson">백업</button><label class="file-btn">복원<input id="importJson" type="file" accept="application/json"></label><button id="resetData" class="danger">초기화</button></div><div id="savedGames"></div></div></div></section>
</main>
<nav class="bottom-nav"><button data-tab="positionTab" class="active"><span>◇</span><b data-i="position">포지션</b></button><button data-tab="lineupTab"><span>☷</span><b data-i="lineup">라인업</b></button><button data-tab="settingsTab"><span>⚙</span><b data-i="settings">설정</b></button></nav>

<div id="saveImageModal" class="save-modal hidden" role="dialog" aria-modal="true" aria-labelledby="saveImageTitle">
  <div class="save-modal-card">
    <h2 id="saveImageTitle">이미지 저장</h2>
    <p id="saveImageDescription">저장할 구성을 선택하세요.</p>
    <button data-image-type="position">포지션</button>
    <button data-image-type="lineup">라인업</button>
    <button data-image-type="combined">포지션+라인업</button>
    <button id="cancelImageSave" class="secondary">취소</button>
  </div>
</div>
<div id="toast" class="toast"></div><div id="dragGhost" class="drag-ghost hidden"></div>
<script src="app-v10216.js"></script></body></html>
