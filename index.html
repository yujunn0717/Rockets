<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="라인업 메이커">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css">
<title>라인업 메이커 PWA v1.0.3</title></head><body>
<div id="languageGate" class="gate hidden"><div class="gate-card"><h1>언어 선택</h1><p>Select language · 言語を選択</p><button data-lang="ko">한국어</button><button data-lang="en">English</button><button data-lang="ja">日本語</button></div></div>
<header class="topbar"><button id="undoBtn" class="icon">↶</button><button id="redoBtn" class="icon">↷</button><input id="gameTitle" aria-label="경기 제목"><div class="top-actions"><button id="saveGameBtn">저장</button><button id="shareBtn">공유</button></div></header>
<main>
<section id="positionTab" class="tab active"><div class="position-layout"><div id="boardCard" class="card board-card"><div id="field" class="field"><img src="baseball-field.png" alt="baseball field"><div id="markers"></div><div id="benchPanel" class="bench-panel"></div></div></div><div id="portraitTable" class="portrait-table card"></div></div><div id="warnings" class="warnings"></div></section>
<section id="lineupTab" class="tab"><div class="lineup-grid"><div class="card"><h2 data-i="starters">선발</h2><div id="starterEditor"></div><button id="addStarter" class="primary">+ 타순 추가</button></div><div class="card"><h2 data-i="bench">벤치</h2><div id="benchEditor"></div><button id="addBench" class="primary">+ 벤치 추가</button></div></div></section>
<section id="settingsTab" class="tab"><div class="settings-grid"><div class="card"><h2 data-i="teamSettings">팀 설정</h2><label><span data-i="teamName">팀명</span><input id="teamName"></label><label><span data-i="defaultPlayers">기본 출전 선수</span><select id="defaultCount"></select></label><fieldset><legend data-i="dh">지명타자</legend><label><input type="radio" name="dh" value="on"> <span data-i="use">사용</span></label><label><input type="radio" name="dh" value="off"> <span data-i="notUse">미사용</span></label></fieldset><fieldset><legend data-i="benchPosition">포지션 탭 벤치멤버</legend><label><input type="radio" name="showBench" value="on"> <span data-i="show">보이기</span></label><label><input type="radio" name="showBench" value="off"> <span data-i="hide">숨기기</span></label></fieldset><label><span data-i="language">언어</span><select id="languageSelect"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></label></div><div class="card"><h2 data-i="playerManagement">선수 관리</h2><div class="player-head"><span data-i="number">등번호</span><span data-i="name">이름</span><span data-i="position">포지션</span><span></span></div><div id="playerManager"></div><button id="addPlayer" class="primary">+ 선수 추가</button></div><div class="card"><h2>데이터</h2><div class="button-row"><button id="exportJson">백업</button><label class="file-btn">복원<input id="importJson" type="file" accept="application/json"></label><button id="resetData" class="danger">초기화</button></div><div id="savedGames"></div></div></div></section>
</main>
<nav class="bottom-nav"><button data-tab="positionTab" class="active"><span>◇</span><b data-i="position">포지션</b></button><button data-tab="lineupTab"><span>☷</span><b data-i="lineup">라인업</b></button><button data-tab="settingsTab"><span>⚙</span><b data-i="settings">설정</b></button></nav>
<div id="toast" class="toast"></div><div id="dragGhost" class="drag-ghost hidden"></div>
<script src="app.js"></script></body></html>
